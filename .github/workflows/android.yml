name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes don't race on the "apk-latest" release.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build CarPolo.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = number of commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CarPolo.apk
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPolo-apk
          path: dist/CarPolo.apk
          if-no-files-found: error

      # Replace the previous "apk-latest" release so the tag always points at this commit.
      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: "CarPolo – dernière version"
          prerelease: true
          make_latest: false
          files: dist/CarPolo.apk
          body: |
            Dernière version du jeu **CarPolo** (branche `${{ github.ref_name }}`, commit `${{ github.sha }}`).

            **Installer sur Android :**
            1. Sur le téléphone, ouvrez cette page et téléchargez **CarPolo.apk** ci-dessous.
            2. Ouvrez le fichier téléchargé. Si Android le demande, autorisez l'installation d'applications depuis cette source (navigateur ou gestionnaire de fichiers).
            3. Touchez **Installer**, puis lancez **CarPolo**.

            Les nouvelles versions s'installent par-dessus l'ancienne (même signature), sans perdre vos meilleurs temps.
