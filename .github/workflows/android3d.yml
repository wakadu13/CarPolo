name: Android APK 3D

on:
  push:
    paths:
      - "game3d/**"
      - ".github/workflows/android3d.yml"
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes don't race on the "apk3d-latest" release.
concurrency:
  group: android-apk3d
  cancel-in-progress: false

jobs:
  build:
    name: Build CarPolo3D.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = number of commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "Using NDK: $NDK"
          echo "CARPOLO_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          game3d/android/build-apk.sh \
            --ndk "$CARPOLO_NDK" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" \
            --out dist/CarPolo3D.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPolo3D-apk
          path: dist/CarPolo3D.apk
          if-no-files-found: error

      # Replace the previous "apk3d-latest" release so the tag always points at this commit.
      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk3d-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk3d-latest
          target_commitish: ${{ github.sha }}
          name: "CarPolo 3D – dernière version"
          prerelease: true
          make_latest: false
          files: dist/CarPolo3D.apk
          body: |
            Dernière version de **CarPolo 3D** (C + raylib, la C4 Cactus en 3D sur le vrai trajet) —
            branche `${{ github.ref_name }}`, commit `${{ github.sha }}`.

            **Installer sur Android (8.0 ou plus récent) :**
            1. Sur le téléphone, ouvrez cette page et téléchargez **CarPolo3D.apk** ci-dessous.
            2. Ouvrez le fichier téléchargé. Si Android le demande, autorisez l'installation d'applications depuis cette source.
            3. Touchez **Installer**, puis lancez **CarPolo 3D**.

            Les nouvelles versions s'installent par-dessus l'ancienne (même signature).
